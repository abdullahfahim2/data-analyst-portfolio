<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{% endblock title %}</title>
    <link rel="shortcut icon" href="{{ profile.profile_image.url }}" type="image/x-icon">

    <!-- tailwind css cdn -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- fontawesome icon cdn -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- meta descriptions -->
    <meta property="og:title" content="{{ profile.name }} - Full Stack Developer Portfolio">
    <meta property="og:description"
        content="Web development and data science projects by {{ profile.name }}. Python, Django, React, and machine learning solutions.">
    <meta name="description"
        content="Full-stack developer & data scientist from Bangladesh. Specializing in Python, Django, React, and machine learning. Check out my projects and contact me!">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            scroll-behavior: smooth;
            background-color: #0a0a0a;
            overflow-x: hidden;
            color: #e5e7eb;
        }

        .gradient-text {
            background: linear-gradient(90deg, #818cf8 0%, #3b82f6 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .section-title {
            position: relative;
            display: inline-block;
        }

        .animate-gradient {
            background-size: 300% 300%;
            animation: gradient 6s ease infinite;
        }

        .section-title:after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 0;
            width: 50%;
            height: 4px;
            background: linear-gradient(90deg, #818cf8 0%, #3b82f6 100%);
            border-radius: 2px;
            animation: pulseScale 2s ease-in-out infinite;
        }

        .timeline-item:before {
            content: '';
            position: absolute;
            left: -32px;
            top: 0;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #3b82f6;
            border: 3px solid #1e40af;
        }

        .skill-pill:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
        }

        .project-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
        }

        /* Glass morphism effect */
        .glass-card {
            background: rgba(17, 24, 39, 0.8);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #e5e7eb;
        }

        /* Octagon shape styling */
        .octagon-shape {
            width: 280px;
            height: 280px;
            position: relative;
            clip-path: polygon(30% 0%, 70% 0%, 100% 30%, 100% 70%, 70% 100%, 30% 100%, 0% 70%, 0% 30%);
            background: linear-gradient(135deg, #1f2937 0%, #111827 100%);
            padding: 8px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
        }

        .octagon-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            clip-path: polygon(30% 0%, 70% 0%, 100% 30%, 100% 70%, 70% 100%, 30% 100%, 0% 70%, 0% 30%);
        }

        /* Subtle hover effect */
        .octagon-shape:hover {
            transform: scale(1.02);
            transition: transform 0.3s ease;
        }

        /* Section backgrounds */
        .section-bg {
            background: linear-gradient(135deg, rgba(17, 24, 39, 0.9) 0%, rgba(31, 41, 55, 0.9) 100%);
            position: relative;
            overflow: hidden;
        }

        /* Hero section specific styling */
        .hero-bg {
            background: linear-gradient(135deg, #1e40af 0%, #3b82f6 100%);
            position: relative;
            overflow: hidden;
        }

        /* Footer styling */
        .footer-bg {
            background-color: #111827;
        }

        .animate-fade-in-up {
            animation: fadeInUp 0.6s ease-out forwards;
        }

        .animate-delayed-fade-in {
            animation: fadeIn 0.8s ease-out 0.4s forwards;
            opacity: 0;
        }

        @keyframes fade-in-up {
            0% {
                opacity: 0;
                transform: translateY(10px);
            }

            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-fade-in-up {
            animation: fade-in-up 0.3s ease-out forwards;
        }

        /* Optional: Auto-dismiss after 5 seconds */
        .auto-dismiss {
            animation: fade-in-up 0.3s ease-out forwards, fade-out 0.3s ease-in 4.7s forwards;
        }

        @keyframes fade-out {
            to {
                opacity: 0;
                transform: translateY(-10px);
            }
        }

        @keyframes gradient {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulseScale {
            0% {
                transform: scaleX(1);
            }

            50% {
                transform: scaleX(1.3);
            }

            100% {
                transform: scaleX(1);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        /* Responsive fixes */
        @media (max-width: 768px) {
            .blurry-circle-1 {
                width: 200px;
                height: 200px;
                top: -50px;
                right: -50px;
            }

            .blurry-circle-2 {
                width: 300px;
                height: 300px;
                bottom: -100px;
                left: -100px;
            }

            .blurry-circle-3 {
                width: 150px;
                height: 150px;
            }

            .hero-content {
                flex-direction: column;
            }

            .hero-text {
                width: 100%;
                text-align: center;
            }

            .hero-image {
                width: 100%;
                margin-top: 2rem;
            }

            .octagon-shape {
                width: 200px;
                height: 200px;
            }

            .section-padding {
                padding: 3rem 1rem;
            }

            .project-card {
                width: 100%;
                margin: 0 auto;
            }
        }
    </style>
</head>

<body class="antialiased">
    {% include "profile/include/navbar.html" %}
    {% block content %}{% endblock content %}
    {% include "profile/include/footer.html" %}
    <!-- javascripts used -->
    <script>
        // tailwind configuration for color
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#3b82f6',
                        secondary: '#1e40af',
                        accent: '#10b981',
                        dark: '#1f2937',
                        light: '#111827'
                    }
                }
            }
        }

        // mobie menu script
        const btn = document.querySelector(".mobile-menu-button");
        const menu = document.querySelector(".mobile-menu");

        btn.addEventListener("click", () => {
            menu.classList.toggle("hidden");
        });

        // Close menu when clicking a link
        document.querySelectorAll('.mobile-menu a').forEach(item => {
            item.addEventListener('click', () => {
                menu.classList.add('hidden');
            });
        });

        // Smooth scrolling for anchor links
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                e.preventDefault();
                document.querySelector(this.getAttribute('href')).scrollIntoView({
                    behavior: 'smooth'
                });
            });
        });

        // javascript for hero section carousel
        document.addEventListener('DOMContentLoaded', function () {
            const slides = [
                document.getElementById('slide1'),
                document.getElementById('slide2'),
                document.getElementById('slide3')
            ];
            let currentSlide = 0;
            function showSlide(index) {
                slides.forEach((slide, i) => {
                    slide.style.opacity = i === index ? '1' : '0';
                });
            }

            function nextSlide() {
                currentSlide = (currentSlide + 1) % slides.length;
                showSlide(currentSlide);
            }
            // Change slide every 5 seconds
            setInterval(nextSlide, 5000);
            // Initialize first slide
            showSlide(0);
        });
    </script>
</body>

</html>
